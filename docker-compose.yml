services:
  db:
    image: postgres:16-alpine
    container_name: waypoint-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: waypoint
      POSTGRES_USER: waypoint
      POSTGRES_PASSWORD: waypoint_dev_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waypoint -d waypoint"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: waypoint-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+asyncpg://waypoint:waypoint_dev_password@db:5432/waypoint
      SECRET_KEY: dev_waypoint_secret_key_super_secure_for_jwt_2026
      CORS_ORIGINS: "http://localhost:5173,http://localhost:3000,http://127.0.0.1:5173"
      PORT: "8000"
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./fixtures:/fixtures:ro
      - /app/__pycache__
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: waypoint-frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  pgdata:
    driver: local
