services:
  caddy:
    image: caddy:2-alpine
    container_name: waypoint-caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-admin@example.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - frontend
      - backend

  db:
    image: postgres:16-alpine
    container_name: waypoint-prod-db
    restart: always
    environment:
      POSTGRES_DB: waypoint
      POSTGRES_USER: waypoint
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata_prod:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U waypoint -d waypoint"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.prod
    container_name: waypoint-prod-backend
    restart: always
    environment:
      DATABASE_URL: postgresql+asyncpg://waypoint:${POSTGRES_PASSWORD}@db:5432/waypoint
      SECRET_KEY: ${SECRET_KEY}
      CORS_ORIGINS: "https://${DOMAIN},http://${DOMAIN}"
      PORT: "8000"
    volumes:
      - ./fixtures:/fixtures:ro
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
      args:
        VITE_API_URL: ""
    container_name: waypoint-prod-frontend
    restart: always
    depends_on:
      - backend

volumes:
  pgdata_prod:
  caddy_data:
  caddy_config:
