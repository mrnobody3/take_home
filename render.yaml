services:
  # 1. FastAPI Backend Web Service
  - type: web
    name: waypoint-backend
    runtime: python
    region: frankfurt
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: waypoint-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: https://waypoint-frontend.onrender.com,http://localhost:5173

  # 2. React Vite Frontend Static Site
  - type: web
    name: waypoint-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: waypoint-backend
          envVarKey: RENDER_EXTERNAL_URL

databases:
  # 3. Managed PostgreSQL Database
  - name: waypoint-db
    databaseName: waypoint
    user: waypoint
    region: frankfurt
    plan: free
